name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools"
          sdkmanager --install "build-tools;36.0.0" || true
          sdkmanager --install "build-tools;37.0.0" || true
          sdkmanager --install "platforms;android-37.0" || sdkmanager --install "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check security invariants
        run: bash scripts/check-invariants.sh

      - name: Test and build debug APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core:domain:test :core:data:test :core:protocol:test \
            :core:mirror:test :core:ssh:test \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
