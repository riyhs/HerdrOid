name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools"
          sdkmanager --install "build-tools;36.0.0" || true
          sdkmanager --install "build-tools;37.0.0" || true
          sdkmanager --install "platforms;android-37.0" || sdkmanager --install "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version from tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag must look like v0.1 or v0.1.0 (got ${GITHUB_REF_NAME})."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Releasing HerdrOid $VERSION (versionCode $VERSION_CODE)"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HERDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::HERDROID_KEYSTORE_BASE64 is missing. Follow docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"

      - name: Check security invariants
        run: bash scripts/check-invariants.sh

      - name: Build signed release
        env:
          HERDROID_KEYSTORE: ${{ github.workspace }}/release.keystore
          HERDROID_KEYSTORE_PASSWORD: ${{ secrets.HERDROID_KEYSTORE_PASSWORD }}
          HERDROID_KEY_ALIAS: ${{ secrets.HERDROID_KEY_ALIAS }}
          HERDROID_KEY_PASSWORD: ${{ secrets.HERDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            :core:domain:test :core:data:test :core:protocol:test \
            :core:mirror:test :core:ssh:test \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -Pherdroid.versionName="$VERSION" \
            -Pherdroid.versionCode="$VERSION_CODE"

      - name: Verify and package APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "HerdrOid-${VERSION}.apk"
          sha256sum "HerdrOid-${VERSION}.apk" > "HerdrOid-${VERSION}.apk.sha256"
          cat "HerdrOid-${VERSION}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HerdrOid ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            HerdrOid-${{ env.VERSION }}.apk
            HerdrOid-${{ env.VERSION }}.apk.sha256

      - name: Remove signing keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"
